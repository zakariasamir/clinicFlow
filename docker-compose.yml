version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: clinicflow-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: clinicflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis (Message Queues & Background Workers)
  redis:
    image: redis:7-alpine
    container_name: clinicflow-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend REST API
  api:
    build:
      context: ./clinicflow-api-v1
      dockerfile: Dockerfile
    container_name: clinicflow-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      API_ENV: docker
      API_PREFIX: /api/v1
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/clinicflow_db?schema=public
      JWT_SECRET: clinicflow_super_secret_jwt_key_2026_tython_assessment
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "5000:5000"

  # Frontend Next.js Platform
  platform:
    build:
      context: ./clinicflow-platform-v1
      dockerfile: Dockerfile
    container_name: clinicflow-platform
    restart: always
    depends_on:
      - api
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
